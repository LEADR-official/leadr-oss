name: Build image

on:
  workflow_run:
    workflows: ["CI", "Migrations"]
    types:
      - completed
    branches:
      - main
      - '**'  # Include all branches (for PRs)

permissions:
  packages: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if both prerequisite workflows succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set outputs
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          REPO_NAME=${{ github.repository }}
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "IMG_URL=ghcr.io/${REPO_NAME,,}:${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.IMG_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get PR number
        if: github.event.workflow_run.event == 'pull_request'
        id: pr
        run: |
          PR_NUMBER=$(echo '${{ toJson(github.event.workflow_run.pull_requests) }}' | jq -r '.[0].number')
          echo "number=${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Comment on PR with image location
        if: github.event.workflow_run.event == 'pull_request' && steps.pr.outputs.number != ''
        uses: thollander/actions-comment-pull-request@v2
        with:
          pr_number: ${{ steps.pr.outputs.number }}
          message: |
            ## 🐳 Docker Image Built

            The Docker image for this PR has been built and pushed:

            ```
            ${{ steps.vars.outputs.IMG_URL }}
            ```
