services:
  admin-api:
    env_file:
      - ../.env
    environment:
      ENABLE_ADMIN_API: "true"
      ENABLE_CLIENT_API: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client-api:
    env_file:
      - ../.env
    environment:
      ENABLE_ADMIN_API: "false"
      ENABLE_CLIENT_API: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
