services:
  db:
    image: postgres:16
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER:-leadr}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-leadr}
      PGDATA: /data/postgres
    volumes:
      - db_data:/data/postgres
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leadr} -d ${DB_NAME:-leadr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-api:
    env_file:
      - ../.env
    environment:
      ENABLE_ADMIN_API: "true"
      ENABLE_CLIENT_API: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client-api:
    env_file:
      - ../.env
    environment:
      ENABLE_ADMIN_API: "false"
      ENABLE_CLIENT_API: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db_data:
