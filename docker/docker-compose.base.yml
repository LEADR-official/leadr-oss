services:
  api:
    image: ghcr.io/leadr-official/leadr-oss:${LEADR_IMAGE_TAG:-latest}
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER:-leadr}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-leadr}
      PGDATA: /data/postgres
    volumes:
      - db_data:/data/postgres
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leadr} -d ${DB_NAME:-leadr}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
