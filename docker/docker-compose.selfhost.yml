services:
  admin-api:
    extends:
      file: docker-compose.base.yml
      service: admin-api
    image: ghcr.io/leadr-official/leadr-oss:${LEADR_IMAGE_TAG:-latest}
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST must be set to your external PostgreSQL host}
      RUN_MIGRATIONS: "true"
    restart: unless-stopped

  client-api:
    extends:
      file: docker-compose.base.yml
      service: client-api
    image: ghcr.io/leadr-official/leadr-oss:${LEADR_IMAGE_TAG:-latest}
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST must be set to your external PostgreSQL host}
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PORT=${PORT:-8000}
    depends_on:
      admin-api:
        condition: service_healthy
      client-api:
        condition: service_healthy

volumes:
  caddy_data:
